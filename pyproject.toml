[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "douyin-to-obsidian"
version = "1.1.0"
description = "Extract Douyin (抖音) video/image content, transcribe with Whisper, and save as structured Obsidian notes"
authors = [{name = "Ruanzhou9"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
keywords = ["douyin", "obsidian", "whisper", "transcription", "notes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "requests>=2.31.0",
    "yt-dlp>=2024.12.0",
    "faster-whisper>=1.1.0",
    "zhconv>=1.4.3",
]

[project.optional-dependencies]
ffmpeg = ["imageio-ffmpeg>=0.6.0"]
ocr = ["easyocr>=1.7"]
browser = ["playwright>=1.40.0"]
full = ["douyin-to-obsidian[ffmpeg,ocr,browser]"]

[project.scripts]
douyin-extract = "douyin_to_obsidian.extract:main"
douyin-browser-fallback = "douyin_to_obsidian.browser_fallback:main"

[tool.setuptools.packages.find]
include = ["douyin_to_obsidian*"]